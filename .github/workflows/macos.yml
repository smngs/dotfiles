name: macOS Homebrew Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  homebrew-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up dotfiles directory
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"

      - name: Test make help
        run: make -C "$HOME/dotfiles" help

      - name: Test make deploy
        run: make -C "$HOME/dotfiles" deploy

      - name: Verify home symlinks
        run: ls -la "$HOME/" | grep "^l"

      - name: Verify .config symlinks
        run: ls -la "$HOME/.config/"

      - name: Validate Brewfile
        run: brew bundle list --all --file="$HOME/dotfiles/Brewfile"
